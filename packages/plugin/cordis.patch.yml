# This release ships the browser/Desktop Host surface only. dsh-TUI integration
# is deferred to a later release, so no terminal-specific entry is inserted.
- insert:
    - id: xcodex-remote
      name: '@xcoder/xagent'
      config:
        enabled: true
        role: host
        serverUrl: https://agent.xcodex.vip
        managedAgents:
          enabled: true
        codex:
          enabled: true
          binary: codex
